<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J COLLECTION</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Top Bar / Navigation Header -->
  <header class="nike-header">
    <div class="logo-box">
      <img src="logo.webp" alt="J Logo" class="j-logo">
    </div>
    <nav class="top-nav">
      <a href="#about">About Us</a>
    </nav>
  </header>

  <!-- Main Web Section (Hero & Showcase) -->
  <main class="main-web">
    <div class="main-web-container">
      <div class="hero-image-wrapper">
        <img src="IMG_7687.webp" alt="J Perfume Showcase" class="hero-perfume-img">
      </div>
      <div class="hero-info">
        <span class="sub-heading">J COLLECTION</span>
        <h1>EXTRAIT DE PARFUM</h1>
        <p>Premium 25% fragrance oil blend crafted for exceptional longevity and projection.</p>
        <div class="action-buttons">
          <a href="https://wa.me/201000000000?text=Hello,%20I%20want%20to%20order%20J%20Perfume" target="_blank" class="btn-black">Order via WhatsApp</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Clean Footer Section -->
  <footer class="nike-footer">
    <div class="footer-columns">
      
      <!-- Column 1: Media -->
      <div class="footer-col">
        <h4>Media</h4>
        <ul>
          <li><a href="https://instagram.com" target="_blank">Instagram</a></li>
          <li><a href="https://wa.me/201000000000" target="_blank">WhatsApp</a></li>
        </ul>
      </div>

      <!-- Column 2: J Collection / About -->
      <div class="footer-col">
        <h4>J Collection</h4>
        <ul>
          <li><a href="#about">About Us</a></li>
        </ul>
      </div>

    </div>

    <!-- Bottom Copyright Line -->
    <div class="footer-legal">
      <p>&copy; 2026 J Collection, Inc. All rights reserved.</p>
      <div class="legal-links">
        <a href="#">Terms of Use</a>
        <a href="#">Privacy Policy</a>
      </div>
    </div>
  </footer>

</body>
</html>
