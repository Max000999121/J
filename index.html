<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J - GitHub Web</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar">
    <div class="logo">J</div>

    <div class="search">
      <input type="text" placeholder="Search or jump to...">
    </div>

    <nav>
      <a href="#">Pull requests</a>
      <a href="#">Issues</a>
      <a href="#">Marketplace</a>
    </nav>
  </header>

  <main class="container">

    <section class="profile">
      <div class="avatar">J</div>

      <div>
        <h1>Max000999121</h1>
        <p>Welcome to my GitHub Web profile.</p>
      </div>
    </section>

    <section class="repositories">

      <div class="section-header">
        <h2>Repositories</h2>
        <button>New</button>
      </div>

      <div class="repo">
        <h3>J</h3>
        <p>My first GitHub Web project.</p>
        <span>Public</span>
      </div>

      <div class="repo">
        <h3>my-project</h3>
        <p>A new project built with HTML and CSS.</p>
        <span>Public</span>
      </div>

    </section>

  </main>

</body>
</html>
